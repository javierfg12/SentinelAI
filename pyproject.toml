[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelai-security"
version = "1.0.0"
description = "Explainable local SOC analytics for authentication logs"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "SentinelAI project"}]
license = {text = "MIT"}
dependencies = ["streamlit>=1.36,<2", "pandas>=2.0,<3", "plotly>=5.20,<7", "scikit-learn>=1.4,<2", "tzdata>=2024.1"]

[tool.setuptools.packages.find]
include = ["sentinelai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
exclude = ["data"]
