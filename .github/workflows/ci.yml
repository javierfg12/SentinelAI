name: Python CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Check syntax
        run: python -m compileall -q sentinelai app.py
      - name: Unit tests
        run: python -m pytest
      - name: Demo HTML is up to date
        run: python scripts/build_demo_preview.py && git diff --exit-code index.html
      - name: Smoke CLI
        run: python -m sentinelai.cli --input data/demo_auth.csv --output /tmp/sentinel-report.json
